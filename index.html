<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      ============================================================
      SEO / METADATA
      ============================================================
      This block is intentionally kept in sync with `src/config/siteConfig.ts`.
      When reusing this template for a different boutique, update BOTH:
        1. The values below (title, description, OG tags)
        2. src/config/siteConfig.ts -> siteConfig.seo
      A future iteration could inject these at build time; for a static
      single-page demo, editing both keeps things simple and explicit.
    -->
    <title>Shri Maayaas Fashion Designers | Boutique &amp; Fashion Designer in Madurai</title>
    <meta
      name="description"
      content="Shri Maayaas Fashion Designers — bridal wear, designer blouses, Aari embroidery and custom fashion design in Madurai, Tamil Nadu. Explore our collections and enquire on WhatsApp."
    />
    <link rel="canonical" href="https://example.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shri Maayaas Fashion Designers" />
    <meta property="og:title" content="Shri Maayaas Fashion Designers | Boutique & Fashion Designer in Madurai" />
    <meta
      property="og:description"
      content="Bridal wear, designer blouses, Aari embroidery and custom fashion design in Madurai, Tamil Nadu."
    />
    <meta property="og:image" content="/images/hero/hero-01.jpg" />
    <meta property="og:url" content="https://example.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shri Maayaas Fashion Designers" />
    <meta
      name="twitter:description"
      content="Bridal wear, designer blouses, Aari embroidery and custom fashion design in Madurai, Tamil Nadu."
    />
    <meta name="twitter:image" content="/images/hero/hero-01.jpg" />

    <meta name="theme-color" content="#faf6f0" />

    <!-- Fonts: elegant serif for headings, clean sans for body/nav -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
